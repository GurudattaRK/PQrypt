[package]
name = "Pqrypt"
version = "1.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release]
# Optimization settings
opt-level = 3                   # Maximum optimization
lto = "fat"                     # Full link-time optimization
codegen-units = 1               # Single codegen unit for better optimization

# Performance settings
panic = "abort"                 # Smaller binary, faster execution
incremental = false             # Disable incremental compilation for release
overflow-checks = false         # Disable overflow checks for performance
strip = true                    # Strip debug symbols
debug = false                   # No debug info for release

# Additional optimization features
rpath = false                   # Disable rpath for smaller binary
debug-assertions = false        # Disable debug assertions

# Apply optimizations to all dependencies
[profile.release.package."*"]
opt-level = 3                   # Maximum optimization for all dependencies

[dependencies]
rand = "0.8"
getrandom = "0.2"
zeroize = "1.7"
libc = "0.2"
openssl = "0.10"
openssl-sys = "0.9"
hex = "0.4"
android_logger = "0.13"
log = "0.4"
ctor = "0.2"
