[package]
name = "Pqrypt"
version = "1.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "pqrypt"
path = "src/lib.rs"

[[bin]]
name = "pqrypt"
path = "src/main.rs"


[profile.release]
opt-level = 3                    # Maximum optimization
lto = "fat"                     # Full link-time optimization
codegen-units = 1               # Single codegen unit for better optimization
panic = "abort"                 # Smaller binary, faster execution
strip = "debuginfo"             # Remove debug info from binary

[dependencies]
rfd = "0.15.4"
slint = "1.8"
libc = "0.2"
ghash = "0.5"  # Kept as it might be a transitive dependency
subtle = "2.6"  # Kept as it might be a transitive dependency
rand = "0.8"
getrandom = "0.2"
zeroize = "1.7"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_arrays = "0.1"
openssl = "0.10"
openssl-sys = "0.9"

[build-dependencies]
slint-build = "1.8"


